name: Phase 5 Lint Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: python -m pip install --quiet --upgrade ruff

      - name: Capture Ruff repair diff
        run: |
          ruff check --fix \
            vetedge/services/clinical_workspace_phase5.py \
            tests/test_vetedge_clinical_workspace_phase5_contract.py \
            vetedge/tests/test_vetedge_clinical_workspace_phase5.py \
            > /tmp/phase5-ruff.txt 2>&1
          git diff -- \
            vetedge/services/clinical_workspace_phase5.py \
            tests/test_vetedge_clinical_workspace_phase5_contract.py \
            vetedge/tests/test_vetedge_clinical_workspace_phase5.py \
            > /tmp/phase5-ruff.diff
          cat /tmp/phase5-ruff.txt
          cat /tmp/phase5-ruff.diff

      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-ruff-diagnostics
          path: |
            /tmp/phase5-ruff.txt
            /tmp/phase5-ruff.diff
          if-no-files-found: error
