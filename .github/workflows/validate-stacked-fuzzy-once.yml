name: One-off stacked fuzzy validation

on:
  push:
    branches:
      - agent/vetedge-post-pr36-reporting-and-operations

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/vetedge-post-pr36-reporting-and-operations
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install validation dependencies
        run: python -m pip install --upgrade pytest ruff
      - name: Validate and record result
        shell: bash
        run: |
          set +e
          STATUS=0
          DIAG=.vetedge-stacked-fuzzy-validation-diagnostics.txt
          : > "$DIAG"
          echo '=== COMPILE ===' >> "$DIAG"
          python -m compileall -q vetedge >> "$DIAG" 2>&1 || STATUS=1
          echo '=== RUFF ===' >> "$DIAG"
          ruff check \
            vetedge/services/appointment_link_search.py \
            vetedge/services/front_desk_link_search.py \
            vetedge/services/master_link_search.py \
            vetedge/services/remaining_link_search.py \
            vetedge/services/report_filter_search.py \
            vetedge/tests/test_appointment_link_search_contract.py \
            vetedge/tests/test_front_desk_fuzzy_link_search_contract.py \
            vetedge/tests/test_master_fuzzy_link_search_contract.py \
            vetedge/tests/test_remaining_fuzzy_search.py \
            vetedge/tests/test_report_center_smart_filters_contract.py >> "$DIAG" 2>&1 || STATUS=1
          echo '=== PYTEST ===' >> "$DIAG"
          python -m pytest -q \
            vetedge/tests/test_appointment_link_search_contract.py \
            vetedge/tests/test_front_desk_fuzzy_link_search_contract.py \
            vetedge/tests/test_master_fuzzy_link_search_contract.py \
            vetedge/tests/test_remaining_fuzzy_search.py \
            vetedge/tests/test_report_center_smart_filters_contract.py >> "$DIAG" 2>&1 || STATUS=1
          if [ "$STATUS" -eq 0 ]; then RESULT=PASS; else RESULT=FAIL; fi
          printf '%s %s\n' "$RESULT" "$GITHUB_SHA" > .vetedge-stacked-fuzzy-validation-result
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .vetedge-stacked-fuzzy-validation-result "$DIAG"
          git commit -m "test(vetedge): record stacked fuzzy validation diagnostics"
          git push origin HEAD:agent/vetedge-post-pr36-reporting-and-operations
          exit "$STATUS"
