name: Remote Authority Governance Fix

on:
  push:
    branches:
      - feat/vetedge-remote-coreedge-adapter-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/vetedge-remote-coreedge-adapter-v1
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Apply authority governance fix
        run: |
          python - <<'PY'
          from pathlib import Path

          client_path = Path("vetedge/platform_client.py")
          content = client_path.read_text()

          config_keys = '''_REMOTE_CONFIG_KEYS = (
          \t"coreedge_service_url",
          \t"coreedge_api_key",
          \t"coreedge_api_secret",
          \t"coreedge_site_identifier",
          )


          '''
          if config_keys not in content:
              raise SystemExit("remote config key anchor not found")
          content = content.replace(config_keys, "", 1)

          old_authority = '''def get_platform_authority_mode() -> str:
          \t"""Resolve operator-controlled authority without consulting a tenant-facing DocType."""
          \traw_mode = _conf_text("coreedge_authority_mode")
          \tif raw_mode:
          \t\tmode = raw_mode.lower().replace("-", "_")
          \t\tif mode in {REMOTE_MODE, LEGACY_MODE}:
          \t\t\treturn mode
          \t\t_log_warning(
          \t\t\tf"Unsupported coreedge_authority_mode '{raw_mode}'. Failing safe to remote authority."
          \t\t)
          \t\treturn REMOTE_MODE
          \tif _conf_bool("coreedge_remote_required"):
          \t\treturn REMOTE_MODE
          \tif any(_conf_text(key) for key in _REMOTE_CONFIG_KEYS):
          \t\treturn REMOTE_MODE
          \treturn LEGACY_MODE
          '''
          new_authority = '''def get_platform_authority_mode() -> str:
          \t"""Resolve operator-controlled authority without consulting a tenant-facing DocType.

          \t`coreedge_remote_required` is the non-bypassable operator policy. Connection
          \tcredentials alone never activate remote authority, allowing them to be provisioned
          \tand tested before the controlled cutover.
          \t"""
          \tif _conf_bool("coreedge_remote_required"):
          \t\treturn REMOTE_MODE

          \traw_mode = _conf_text("coreedge_authority_mode")
          \tif raw_mode:
          \t\tmode = raw_mode.lower().replace("-", "_")
          \t\tif mode in {REMOTE_MODE, LEGACY_MODE}:
          \t\t\treturn mode
          \t\t_log_warning(
          \t\t\tf"Unsupported coreedge_authority_mode '{raw_mode}'. Failing safe to remote authority."
          \t\t)
          \t\treturn REMOTE_MODE
          \treturn LEGACY_MODE
          '''
          if old_authority not in content:
              raise SystemExit("authority resolver anchor not found")
          content = content.replace(old_authority, new_authority, 1)
          client_path.write_text(content)

          test_path = Path("vetedge/tests/test_remote_platform_client.py")
          tests = test_path.read_text()
          old_test = '''\tdef test_remote_configuration_selects_remote_authority(self):
          \t\tfrappe.conf.coreedge_service_url = "https://platform.example.com"
          \t\tself.assertEqual(client.get_platform_authority_mode(), "remote")

          '''
          new_tests = '''\tdef test_remote_configuration_does_not_activate_authority_before_cutover(self):
          \t\tfrappe.conf.coreedge_service_url = "https://platform.example.com"
          \t\tfrappe.conf.coreedge_api_key = "api-key"
          \t\tfrappe.conf.coreedge_api_secret = "api-secret"
          \t\tfrappe.conf.coreedge_site_identifier = "vet.example.com"
          \t\tself.assertEqual(client.get_platform_authority_mode(), "legacy_auto")

          \tdef test_remote_required_overrides_explicit_legacy_mode(self):
          \t\tfrappe.conf.coreedge_authority_mode = "legacy_auto"
          \t\tfrappe.conf.coreedge_remote_required = 1
          \t\tself.assertEqual(client.get_platform_authority_mode(), "remote")

          '''
          if old_test not in tests:
              raise SystemExit("authority test anchor not found")
          tests = tests.replace(old_test, new_tests, 1)
          test_path.write_text(tests)
          PY

      - name: Install validation dependencies
        run: python -m pip install --upgrade ruff

      - name: Validate patched files
        run: |
          python -m compileall -q \
            vetedge/platform_client.py \
            vetedge/tests/test_remote_platform_client.py
          ruff check \
            vetedge/platform_client.py \
            vetedge/services/platform_access.py \
            vetedge/tests/test_remote_platform_client.py

      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remote-authority-governance-fix.yml
          git add \
            vetedge/platform_client.py \
            vetedge/tests/test_remote_platform_client.py
          git commit -m "fix(vetedge): make remote authority cutover explicit"
          git push origin HEAD:feat/vetedge-remote-coreedge-adapter-v1
