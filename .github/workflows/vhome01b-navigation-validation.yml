name: VetEdge VHOME-01B Navigation Validation

on:
  pull_request:
    branches:
      - qa/vetedge-full-implementation-2026-08-29
    paths:
      - "vetedge/public/js/vetedge_postqa_navigation_hardening.js"
      - "vetedge/public/js/report_pdf_patch.js"
      - "scripts/vhome_postqa_navigation_smoke.py"
      - ".github/workflows/vhome01b-navigation-validation.yml"
  workflow_dispatch:

concurrency:
  group: vhome01b-navigation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  navigation-contract:
    name: VHOME-01B navigation browser contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate source syntax
        run: |
          node --check vetedge/public/js/vetedge_postqa_navigation_hardening.js
          node --check vetedge/public/js/report_pdf_patch.js
          python -m py_compile scripts/vhome_postqa_navigation_smoke.py

      - name: Lock post-QA navigation loader and safety contract
        run: |
          grep -Fq 'vetedge_postqa_navigation_hardening.js?v=20260905-1' vetedge/public/js/report_pdf_patch.js
          grep -Fq 'data-vetedge-direct-home' vetedge/public/js/vetedge_postqa_navigation_hardening.js
          grep -Fq '"/desk/vetedge"' vetedge/public/js/vetedge_postqa_navigation_hardening.js
          grep -Fq 'edge-product-menu-trigger' vetedge/public/js/vetedge_postqa_navigation_hardening.js
          grep -Fq 'edge-product-menu-dropdown' vetedge/public/js/vetedge_postqa_navigation_hardening.js
          grep -Fq 'getProductMenuConfig' vetedge/public/js/vetedge_postqa_navigation_hardening.js
          grep -Fq 'config?.navigate' vetedge/public/js/vetedge_postqa_navigation_hardening.js
          ! grep -Fq 'ignore_permissions' vetedge/public/js/vetedge_postqa_navigation_hardening.js

      - name: Install Playwright
        run: |
          python -m pip install --upgrade playwright
          python -m playwright install --with-deps chromium

      - name: Run Home and product-menu browser smoke
        run: python scripts/vhome_postqa_navigation_smoke.py
