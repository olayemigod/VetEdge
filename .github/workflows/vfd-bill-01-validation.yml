name: VFD-BILL-01 Validation

on:
  pull_request:
    branches:
      - feature/vetedge-smart-home-vhome01
    paths:
      - "vetedge/install/__init__.py"
      - "vetedge/install/dashboard.py"
      - "vetedge/install/patient_navigation.py"
      - "vetedge/services/billing_center.py"
      - "vetedge/public/js/vetedge_billing_center/**"
      - "vetedge/public/js/vetedge_billing_center.bundle.js"
      - "vetedge/public/js/vetedge_front_desk_action_center/**"
      - "vetedge/public/js/vetedge_front_desk_action_center.bundle.js"
      - "vetedge/public/js/vetedge_front_desk_page_host.js"
      - "vetedge/public/js/vetedge_postqa_navigation_hardening.js"
      - "vetedge/veterinary/page/vetedge_billing_center/**"
      - "vetedge/veterinary/page/vetedge_billing_sessions/**"
      - "vetedge/veterinary/page/vetedge_front_desk_action_center/**"
      - "vetedge/veterinary/page/vetedge_front_desk_guest_bookings/**"
      - "vetedge/veterinary/page/vetedge_front_desk_missed_appointments/**"
      - "vetedge/veterinary/page/vetedge_front_desk_queue/**"
      - "vetedge/veterinary/page/veterinary_appointment_queue/**"
      - "vetedge/tests/test_vfd_bill_01_contract.py"
      - "tests/test_vfd_bill_01_source_contract.py"
      - "tests/test_vfd_bill_01_qa_defects.py"
      - ".github/workflows/vfd-bill-01-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vfd-bill-01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    name: Source validation
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --upgrade pytest ruff

      - name: Compile Python
        run: python -m compileall -q vetedge

      - name: Ruff focused Python
        run: |
          ruff check \
            vetedge/install/__init__.py \
            vetedge/install/patient_navigation.py \
            vetedge/services/billing_center.py \
            tests/test_vfd_bill_01_source_contract.py \
            tests/test_vfd_bill_01_qa_defects.py

      - name: Validate VFD-BILL-01 source contracts
        run: |
          python -m pytest -q \
            tests/test_vfd_bill_01_source_contract.py \
            tests/test_vfd_bill_01_qa_defects.py
