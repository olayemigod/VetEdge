name: Remote Adapter Heartbeat Fix

on:
  push:
    branches:
      - feat/vetedge-remote-coreedge-adapter-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/vetedge-remote-coreedge-adapter-v1
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Apply heartbeat observability fix
        run: |
          python - <<'PY'
          from pathlib import Path

          client_path = Path("vetedge/platform_client.py")
          content = client_path.read_text()

          old_signature = '''def get_remote_access_response(
          \t*,
          \tforce_refresh: bool = False,
          \tforce_handshake: bool = False,
          \taction: str | None = None,
          '''
          new_signature = '''def get_remote_access_response(
          \t*,
          \tforce_refresh: bool = False,
          \tforce_handshake: bool = False,
          \tallow_cached_on_error: bool = True,
          \taction: str | None = None,
          '''
          if old_signature not in content:
              raise SystemExit("remote access signature anchor not found")
          content = content.replace(old_signature, new_signature, 1)

          old_fallback = '''\texcept RemotePlatformError:
          \t\tif cached and bool(((cached.get("response") or {}).get("access") or {}).get("allowed")):
          \t\t\treturn cached["response"]
          \t\traise
          '''
          new_fallback = '''\texcept RemotePlatformError:
          \t\tif allow_cached_on_error and cached and bool(
          \t\t\t((cached.get("response") or {}).get("access") or {}).get("allowed")
          \t\t):
          \t\t\treturn cached["response"]
          \t\traise
          '''
          if old_fallback not in content:
              raise SystemExit("cache fallback anchor not found")
          content = content.replace(old_fallback, new_fallback, 1)

          old_heartbeat = '''\t\tget_remote_access_response(
          \t\t\tforce_refresh=True,
          \t\t\tforce_handshake=True,
          \t\t\taction="scheduled_heartbeat",
          \t\t)
          '''
          new_heartbeat = '''\t\tget_remote_access_response(
          \t\t\tforce_refresh=True,
          \t\t\tforce_handshake=True,
          \t\t\tallow_cached_on_error=False,
          \t\t\taction="scheduled_heartbeat",
          \t\t)
          '''
          if old_heartbeat not in content:
              raise SystemExit("heartbeat anchor not found")
          content = content.replace(old_heartbeat, new_heartbeat, 1)
          client_path.write_text(content)

          test_path = Path("vetedge/tests/test_remote_platform_client.py")
          tests = test_path.read_text()
          anchor = '''\tdef test_heartbeat_is_noop_in_legacy_mode(self):
          '''
          addition = '''\tdef test_heartbeat_logs_network_failure_even_with_valid_access_cache(self):
          \t\tself._configure_remote()
          \t\tentry = {
          \t\t\t"response": self._gateway_response(),
          \t\t\t"expires_at_epoch": time.time() + 30,
          \t\t}
          \t\twith (
          \t\t\tpatch("vetedge.platform_client._cache_get", return_value=entry),
          \t\t\tpatch(
          \t\t\t\t"vetedge.platform_client.requests.post",
          \t\t\t\tside_effect=requests.ConnectionError("offline"),
          \t\t\t),
          \t\t\tpatch("vetedge.platform_client._log_warning") as warning,
          \t\t):
          \t\t\tclient.refresh_remote_platform_heartbeat()
          \t\twarning.assert_called_once()
          \t\tself.assertIn("Remote platform heartbeat failed", warning.call_args.args[0])

          \tdef test_heartbeat_is_noop_in_legacy_mode(self):
          '''
          if anchor not in tests:
              raise SystemExit("heartbeat test anchor not found")
          tests = tests.replace(anchor, addition, 1)
          test_path.write_text(tests)
          PY

      - name: Install validation dependencies
        run: python -m pip install --upgrade ruff

      - name: Validate patched files
        run: |
          python -m compileall -q \
            vetedge/platform_client.py \
            vetedge/tests/test_remote_platform_client.py
          ruff check \
            vetedge/platform_client.py \
            vetedge/services/platform_access.py \
            vetedge/tests/test_remote_platform_client.py

      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remote-adapter-heartbeat-fix.yml
          git add \
            vetedge/platform_client.py \
            vetedge/tests/test_remote_platform_client.py
          git commit -m "fix(vetedge): report remote heartbeat failures"
          git push origin HEAD:feat/vetedge-remote-coreedge-adapter-v1
