name: VetEdge Performance Audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "vetedge/**"
      - "tools/vetedge_performance_audit.py"
      - "tests/test_vetedge_performance_audit.py"
      - ".github/workflows/performance-audit.yml"

permissions:
  contents: read

jobs:
  static-performance-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test audit harness
        run: python -m unittest discover -s tests -p 'test_vetedge_performance_audit.py' -v

      - name: Generate performance baseline
        run: |
          python tools/vetedge_performance_audit.py \
            --root . \
            --json-out performance-audit.json \
            --markdown-out performance-audit.md
          cat performance-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance baseline
        uses: actions/upload-artifact@v4
        with:
          name: vetedge-performance-audit
          path: |
            performance-audit.json
            performance-audit.md
          retention-days: 30
