name: Platform Diagnostics CI Wiring

on:
  pull_request:
    branches:
      - feat/vetedge-remote-coreedge-adapter-v1

permissions:
  contents: write

jobs:
  wire:
    if: github.head_ref == 'feat/vetedge-coreedge-connection-diagnostics'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/vetedge-coreedge-connection-diagnostics
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Add diagnostic files to existing CI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          content = path.read_text()

          service_line = "            vetedge/services/platform_access.py \\\n"
          service_insert = service_line + "            vetedge/services/platform_diagnostics.py \\\n"
          if "vetedge/services/platform_diagnostics.py" not in content:
              if service_line not in content:
                  raise SystemExit('Platform-access Ruff anchor not found')
              content = content.replace(service_line, service_insert, 1)

          test_line = "            vetedge/tests/test_remote_platform_client.py \\\n"
          test_insert = test_line + "            vetedge/tests/test_platform_diagnostics.py \\\n"
          if "vetedge/tests/test_platform_diagnostics.py" not in content:
              if test_line not in content:
                  raise SystemExit('Remote-client Ruff anchor not found')
              content = content.replace(test_line, test_insert, 1)

          module_line = "            --module vetedge.tests.test_remote_platform_client\n"
          module_insert = module_line + "\n          bench --site ci.localhost run-tests \\\n            --app vetedge \\\n            --module vetedge.tests.test_platform_diagnostics\n"
          if "--module vetedge.tests.test_platform_diagnostics" not in content:
              if module_line not in content:
                  raise SystemExit('Remote-client Frappe test anchor not found')
              content = content.replace(module_line, module_insert, 1)

          path.write_text(content)
          PY

      - name: Apply and verify focused Ruff fixes
        run: |
          python -m pip install --upgrade ruff
          ruff check --fix \
            vetedge/services/platform_diagnostics.py \
            vetedge/tests/test_platform_diagnostics.py
          ruff check \
            vetedge/services/platform_diagnostics.py \
            vetedge/tests/test_platform_diagnostics.py
          python -m compileall -q \
            vetedge/services/platform_diagnostics.py \
            vetedge/tests/test_platform_diagnostics.py

      - name: Commit CI wiring and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/platform-diagnostics-ci-wire.yml
          git add \
            .github/workflows/ci.yml \
            vetedge/services/platform_diagnostics.py \
            vetedge/tests/test_platform_diagnostics.py
          git commit -m "test(vetedge): validate platform connection diagnostics"
          git push origin HEAD:feat/vetedge-coreedge-connection-diagnostics
