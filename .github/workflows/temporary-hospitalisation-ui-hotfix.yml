name: Temporary Hospitalisation UI Hotfix

on:
  push:
    branches:
      - qa/vetedge-full-implementation-2026-08-29

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: qa/vetedge-full-implementation-2026-08-29
          fetch-depth: 0

      - name: Apply exact bounded UI patch
        shell: python
        run: |
          from pathlib import Path

          page_path = Path('vetedge/veterinary/page/vetedge_hospitalisation_operations/vetedge_hospitalisation_operations.js')
          page = page_path.read_text(encoding='utf-8')

          old_state = """\tconst pathParts = window.location.pathname.split('/').filter(Boolean);\n\tconst pathName = pathParts[0] === 'desk' && pathParts[1] === 'vetedge-hospitalisation-operations'\n\t\t? decodeHospitalisationOperationsRoutePart(pathParts[2])\n\t\t: '';\n\n\tconst params = new URLSearchParams(window.location.search || '');\n\tconst name = String(routeName || pathName || params.get('hospitalisation') || params.get('name') || '').trim();\n"""
          new_state = """\tconst pathParts = window.location.pathname.split('/').filter(Boolean);\n\tconst pathIsOperations = pathParts[0] === 'desk' && pathParts[1] === 'vetedge-hospitalisation-operations';\n\tconst pathName = pathIsOperations ? decodeHospitalisationOperationsRoutePart(pathParts[2]) : '';\n\n\tconst params = new URLSearchParams(window.location.search || '');\n\tconst queryName = params.get('hospitalisation') || params.get('name') || '';\n\t// In-place Episode/Operations transitions update browser history without asking\n\t// the Frappe router to remount the Page. While this Page is current, the URL\n\t// is therefore the authoritative source and must win over a stale router array.\n\tconst name = String(pathIsOperations ? (pathName || queryName) : (routeName || queryName)).trim();\n"""
          if page.count(old_state) != 1:
              raise SystemExit(f'Expected one Hospitalisation route-state block, found {page.count(old_state)}')
          page = page.replace(old_state, new_state)

          old_route = """function routeToHospitalisationOperations(name = '') {\n\tconst hospitalisation = String(name || '').trim();\n\tif (window.frappe?.set_route) {\n\t\tif (hospitalisation) frappe.set_route('vetedge-hospitalisation-operations', hospitalisation);\n\t\telse frappe.set_route('vetedge-hospitalisation-operations');\n\t\treturn;\n\t}\n\twindow.location.assign(hospitalisationOperationsDeskUrl(hospitalisation));\n}\n"""
          new_route = """function routeToHospitalisationOperations(name = '') {\n\tconst hospitalisation = String(name || '').trim();\n\tconst wrapper = window.frappe?.container?.page;\n\tif (wrapper?.page_name === 'vetedge-hospitalisation-operations' && typeof wrapper.on_page_show === 'function') {\n\t\t// Stay inside the already-mounted Frappe Page. This avoids a router remount\n\t\t// (and any stale open-in-new-tab state) while reusing the same secured Page\n\t\t// loader for both the Operations list and hosted Episode workspace.\n\t\tcanonicalizeHospitalisationOperationsRoute(hospitalisation);\n\t\twrapper.on_page_show(wrapper);\n\t\treturn;\n\t}\n\tif (window.frappe?.set_route) {\n\t\tif (hospitalisation) frappe.set_route('vetedge-hospitalisation-operations', hospitalisation);\n\t\telse frappe.set_route('vetedge-hospitalisation-operations');\n\t\treturn;\n\t}\n\twindow.location.assign(hospitalisationOperationsDeskUrl(hospitalisation));\n}\n"""
          if page.count(old_route) != 1:
              raise SystemExit(f'Expected one Hospitalisation routing block, found {page.count(old_route)}')
          page = page.replace(old_route, new_route)
          page_path.write_text(page, encoding='utf-8')

          bundle_path = Path('vetedge/public/js/vetedge_hospitalisation_operations.bundle.js')
          bundle = bundle_path.read_text(encoding='utf-8')
          old_bundle = """function openHospitalisationInOperations(name) {\n\tconst hospitalisation = String(name || '').trim();\n\tif (!hospitalisation) return;\n\tif (window.frappe?.set_route) {\n\t\twindow.frappe.set_route('vetedge-hospitalisation-operations', hospitalisation);\n\t\treturn;\n\t}\n\twindow.location.assign(`/desk/vetedge-hospitalisation-operations/${encodeURIComponent(hospitalisation)}`);\n}\n"""
          new_bundle = """function openHospitalisationInOperations(name) {\n\tconst hospitalisation = String(name || '').trim();\n\tif (!hospitalisation) return;\n\tconst wrapper = window.frappe?.container?.page;\n\tif (wrapper?.page_name === 'vetedge-hospitalisation-operations' && typeof wrapper.on_page_show === 'function') {\n\t\tconst target = `/desk/vetedge-hospitalisation-operations/${encodeURIComponent(hospitalisation)}`;\n\t\tif (`${window.location.pathname}${window.location.search}` !== target) {\n\t\t\twindow.history.replaceState({}, '', target);\n\t\t}\n\t\twrapper.on_page_show(wrapper);\n\t\treturn;\n\t}\n\tif (window.frappe?.set_route) {\n\t\twindow.frappe.set_route('vetedge-hospitalisation-operations', hospitalisation);\n\t\treturn;\n\t}\n\twindow.location.assign(`/desk/vetedge-hospitalisation-operations/${encodeURIComponent(hospitalisation)}`);\n}\n"""
          if bundle.count(old_bundle) != 1:
              raise SystemExit(f'Expected one Operations bundle routing block, found {bundle.count(old_bundle)}')
          bundle = bundle.replace(old_bundle, new_bundle)
          bundle_path.write_text(bundle, encoding='utf-8')

          test_path = Path('vetedge/tests/test_hospitalisation_preqa_hardening_contract.py')
          test = test_path.read_text(encoding='utf-8')
          needle = """    assert \"openHospitalisationEpisodeRoute(event.row.hospitalisation)\" in page\n    assert \"Patient & Pet Owner\" in page\n"""
          replacement = """    assert \"openHospitalisationEpisodeRoute(event.row.hospitalisation)\" in page\n    assert \"wrapper?.page_name === 'vetedge-hospitalisation-operations'\" in page\n    assert \"typeof wrapper.on_page_show === 'function'\" in page\n    assert \"canonicalizeHospitalisationOperationsRoute(hospitalisation)\" in page\n    assert \"wrapper.on_page_show(wrapper)\" in page\n    assert \"pathIsOperations\" in page\n    assert \"pathIsOperations ? (pathName || queryName)\" in page\n    assert \"Patient & Pet Owner\" in page\n"""
          if test.count(needle) != 1:
              raise SystemExit(f'Expected one Hospitalisation drill-through assertion block, found {test.count(needle)}')
          test = test.replace(needle, replacement)

          insert_after = """def test_hospitalisation_operations_failed_drillthrough_is_hardened_in_place():\n"""
          if insert_after not in test:
              raise SystemExit('Hospitalisation drill-through test not found')

          test += """\n\ndef test_operations_bundle_prefers_current_workspace_before_frappe_router():\n    bundle = read(ROOT / \"public\" / \"js\" / \"vetedge_hospitalisation_operations.bundle.js\")\n\n    assert \"window.frappe?.container?.page\" in bundle\n    assert \"wrapper?.page_name === 'vetedge-hospitalisation-operations'\" in bundle\n    assert \"window.history.replaceState({}, '', target)\" in bundle\n    assert \"wrapper.on_page_show(wrapper)\" in bundle\n    assert bundle.index(\"wrapper.on_page_show(wrapper)\") < bundle.index(\"window.frappe.set_route('vetedge-hospitalisation-operations', hospitalisation)\")\n"""
          test_path.write_text(test, encoding='utf-8')

          workflow_path = Path('.github/workflows/edgesuite-ui-candidate-compat.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          old_sha = 'e40ea4d7dc000d17443a0571c1e246b61bfd3e1d'
          new_sha = '821f093e893737c20eec2288ea8cf1b0f06d65ed'
          occurrences = workflow.count(old_sha)
          if occurrences < 2:
              raise SystemExit(f'Expected at least two governed EdgeSuite SHA pins, found {occurrences}')
          workflow_path.write_text(workflow.replace(old_sha, new_sha), encoding='utf-8')

          Path('.github/workflows/temporary-hospitalisation-ui-hotfix.yml').unlink()

      - name: Commit bounded fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vetedge/veterinary/page/vetedge_hospitalisation_operations/vetedge_hospitalisation_operations.js \
                  vetedge/public/js/vetedge_hospitalisation_operations.bundle.js \
                  vetedge/tests/test_hospitalisation_preqa_hardening_contract.py \
                  .github/workflows/edgesuite-ui-candidate-compat.yml \
                  .github/workflows/temporary-hospitalisation-ui-hotfix.yml
          git diff --cached --check
          git commit -m "fix(vetedge): keep Hospitalisation drill-through in place"
          git push origin HEAD:qa/vetedge-full-implementation-2026-08-29
